name: "Intergral: Docker Build & Push"

on:
  push:
    branches: ["*-intergral"]
  workflow_dispatch:
    inputs:
      go_build_dev:
        description: 'Set to "dev" for development build'
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine build mode
        id: build-mode
        run: |
          GO_BUILD_DEV="${{ github.event.inputs.go_build_dev }}"
          if [ "$GO_BUILD_DEV" = "dev" ]; then
            echo "js_node_env=dev" >> "$GITHUB_OUTPUT"
            echo "js_yarn_build_flag=dev" >> "$GITHUB_OUTPUT"
            echo "js_yarn_install_flag=" >> "$GITHUB_OUTPUT"
            echo "go_build_dev=dev" >> "$GITHUB_OUTPUT"
          else
            echo "js_node_env=production" >> "$GITHUB_OUTPUT"
            echo "js_yarn_build_flag=build" >> "$GITHUB_OUTPUT"
            echo "js_yarn_install_flag=--immutable" >> "$GITHUB_OUTPUT"
            echo "go_build_dev=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: intergral/grafana
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JS_NODE_ENV=${{ steps.build-mode.outputs.js_node_env }}
            JS_YARN_BUILD_FLAG=${{ steps.build-mode.outputs.js_yarn_build_flag }}
            JS_YARN_INSTALL_FLAG=${{ steps.build-mode.outputs.js_yarn_install_flag }}
            GO_BUILD_DEV=${{ steps.build-mode.outputs.go_build_dev }}
            GO_BUILD_TAGS=oss
            WIRE_TAGS=oss
            COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
