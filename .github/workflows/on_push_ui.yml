name: Build & Test UI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"

      - name: Check dependencies
        run: |
          yarn install --immutable

      - name: Test
        # test:ci instead of test:coverage: nothing consumes the coverage report, and
        # coverage instrumentation at default worker count OOMs the runner's node heap
        # (run 31776603020). Two workers fit comfortably in a standard runner.
        run: yarn test:ci
        env:
          TEST_MAX_WORKERS: 2

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"

      - name: Check dependencies
        run: |
          yarn install --immutable

      - name: Build
        run: yarn build

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"

      - name: Check dependencies
        run: |
          yarn install --immutable

      - name: Lint
        run: yarn lint
