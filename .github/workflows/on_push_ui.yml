name: Build & Test UI

on:
  push:
    branches: [ "*" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"

      - name: Check dependencies
        run: |
          yarn install --immutable

      - name: Test
        # test:ci instead of test:coverage: nothing consumes the coverage report, and
        # coverage instrumentation OOMs the runner's node heap (run 31776603020).
        # Sharding plus workerIdleMemoryLimit keeps leak accumulation in long-lived jest
        # workers under the ~4GB per-process heap cap (run 31782161380).
        run: yarn test:ci --workerIdleMemoryLimit=1792MB
        env:
          TEST_MAX_WORKERS: 2
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_TOTAL: 4

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"

      - name: Check dependencies
        run: |
          yarn install --immutable

      - name: Build
        run: yarn build

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "yarn"

      - name: Check dependencies
        run: |
          yarn install --immutable

      - name: Lint
        run: yarn lint
